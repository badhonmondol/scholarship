name: scholar_search
description: ScholarSearch - Auto-syncing scholarship finder. 100+ scholarships, 50+ countries, zero manual work.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Required)
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.0

  # HTTP requests
  http: ^1.2.1

  # Open scholarship URLs in browser
  url_launcher: ^6.3.0

  # Store last sync time + saved IDs locally
  shared_preferences: ^2.5.3

  # Number formatting ($35,000)
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "scholarship logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#1A56DB"
  adaptive_icon_foreground: "scholarship logo.jpg"
